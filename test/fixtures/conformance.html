<!DOCTYPE html>
<html lang="en"
      nc:owner="npub16kwfcualkq4kz6vgs8tze0j4jkpgs53h48ghmpnj80s7cvfjspwsh4uk9u"
      nc:site="conf"
      nc:relays="wss://127.0.0.1:1" nc:servers="https://127.0.0.1:1">
<head><meta charset="utf-8"><title>conformance</title></head>
<body>
  <div id="prose" editable><p>first paragraph</p></div>
  <h1 id="line" editable="single-line">a title</h1>
  <div id="board">
    <article class="card" data-status="active"><span editable="single-line">one</span>
      <label for="card-one-note">note</label><input id="card-one-note" value="">
      <menu class="nc-gear nc-gear-row"><button type="button">x</button></menu></article>
    <article class="card" data-status="done"><span editable="single-line">two</span></article>
  </div>
  <div class="col" id="col-a"><article class="card" data-status="active"><span editable="single-line">travels</span>
      <menu class="nc-gear nc-gear-row"><button type="button">&gt;</button></menu></article></div>
  <div class="col" id="col-b"></div>
  <div id="cmsroot">
    <h1 class="site-title">Old title</h1>
    <img class="hero" src="/a.png" alt="hero">
    <span class="status" data-open="no">status</span>
    <span class="tag">one</span><span class="tag">two</span>
    <article class="post"><h3 class="post-title">First</h3><p class="post-body">Body one.</p></article>
    <article class="post"><h3 class="post-title">Second</h3><p class="post-body">Body two.</p></article>
    <article class="post" nc:cms-template><h3 class="post-title">New</h3><p class="post-body">Say something.</p></article>
  </div>
  <script type="application/json" nc:cms>
  {
    "title": ".site-title",
    "hero": "img.hero@src",
    "open": ".status@data-open",
    "tags": ".tag[]",
    "posts": [".post", { "heading": ".post-title", "body": ".post-body" }]
  }
  </script>
  <template id="card-tpl"><article class="card" data-status="active"><span editable="single-line">new</span></article></template>
  <input id="filter" nc:no-persist value="typed-filter">
  <input id="f" value="typed">
  <input id="secret" type="password" value="">
  <input id="upload" type="file">
  <div id="widget" nc:feed="notes" nc:authors="npub16kwfcualkq4kz6vgs8tze0j4jkpgs53h48ghmpnj80s7cvfjspwsh4uk9u"
       nc:limit="2"><article class="nc-item" nc:transient="">fetched at view time</article></div>
  <div nc:chrome>runtime UI, never saved</div>
  <div clay="no-save">never saved</div>
  <form id="composer" clay="no-save"><input class="nc-input" nc:no-persist></form>
  <main id="blockarea" nc:blocks>
    <section nc:block-type="heading"><h2 editable="single-line">First</h2></section>
    <section nc:block-type="rule"><hr></section>
    <!-- The shape the paste bug came out of: a single-line region that is
         itself an inline element, so anything block-shaped put inside it makes
         the browser split it. -->
    <section id="btnblock" class="b-button" nc:block-type="button">
      <a id="btn" href="#" editable="single-line">Stay cool</a>
    </section>
  </main>
  <template nc:block="heading" nc:label="Heading" nc:icon="H" nc:group="Text">
    <section class="b-heading"><h2 editable="single-line">A heading</h2></section>
  </template>
  <template nc:block="rule" nc:label="Divider" nc:icon="—" nc:group="Text">
    <section class="b-rule"><hr></section>
  </template>
  <template nc:block="picture" nc:label="Picture" nc:icon="▥" nc:group="Media" nc:on-add="image">
    <section class="b-picture"><figure><img nc:slot src="about:blank" alt=""></figure></section>
  </template>
  <script src="/nsite-clay.js"></script>
</body>
</html>
